# Earmark → ChatGPT: custom GPT Action schema
#
# This file lets a ChatGPT custom GPT read your Earmark newsletter library
# (the cloud copy that the "Share with Claude" switch keeps in sync).
#
# One-time setup (~3 minutes, needs ChatGPT Plus):
#   1. In ChatGPT: Explore GPTs -> Create -> Configure.
#   2. Name it "Earmark Reader". In Instructions, paste:
#        You are the reader for my Earmark newsletter library. Whenever I ask
#        about my newsletters or saved articles, call getLibrary and use
#        data.articles (each has title, source, played, text). Summarize,
#        analyze, compare, and answer questions from those texts. Quote the
#        article titles you used.
#   3. Under Actions -> Create new action, paste this whole file as the schema.
#   4. Under Authentication choose: API Key, Auth Type "Custom",
#      Custom Header Name: apikey
#      API Key: sb_publishable_d8MDw2wnT_uigdaztsGnuw_rKyilUlz
#   5. Save. Then just chat: "summarize my latest newsletter".
#
# The key above is the same public read key Earmark's "Copy the Claude link"
# button shares — anyone holding it can read the synced articles, nothing else.

openapi: 3.1.0
info:
  title: Earmark Newsletter Library
  description: Read-only access to the owner's Earmark newsletter library — saved articles with full text.
  version: 1.0.0
servers:
  - url: https://wtocvytzakfzetxvoduj.supabase.co
paths:
  /rest/v1/app_state:
    get:
      operationId: getLibrary
      summary: Fetch the saved newsletter articles
      description: >
        Returns one row whose data.articles is the list of saved articles.
        Always call with id=eq.earmark and select=data,updated_at.
      parameters:
        - name: id
          in: query
          required: true
          description: Always exactly "eq.earmark".
          schema:
            type: string
            default: eq.earmark
        - name: select
          in: query
          required: true
          description: Always exactly "data,updated_at".
          schema:
            type: string
            default: data,updated_at
      responses:
        "200":
          description: Library rows (an array with one element).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    updated_at:
                      type: string
                      description: When the library copy was last updated.
                    data:
                      type: object
                      properties:
                        note:
                          type: string
                        articles:
                          type: array
                          items:
                            type: object
                            properties:
                              title:
                                type: string
                              source:
                                type: string
                              played:
                                type: boolean
                                description: Whether the owner has finished listening to it.
                              text:
                                type: string
                                description: The full article text.
