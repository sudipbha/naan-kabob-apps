name: Refresh Earmark trending

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Lets the last step start the "Deploy to GitHub Pages" workflow.
  actions: write

concurrency:
  group: earmark-ai-trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline parser and policy self-test
        run: node tools/earmark-trending-refresh.js --self-test
      - name: Generate and validate curated metadata
        run: |
          node tools/earmark-trending-refresh.js
          node tools/earmark-trending-refresh.js --validate earmark/trending.json
      - name: Commit only when the feed changed
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- earmark/trending.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earmark/trending.json
          git commit -m "Refresh Earmark AI trending feed"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      # A push made with GITHUB_TOKEN starts no other workflow: no push event,
      # and no workflow_run either, because this run's actor is
      # github-actions[bot]. workflow_dispatch is the exception GitHub allows,
      # so ask for the Pages deploy directly. Only runs after a real push.
      - name: Publish the new feed to GitHub Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          for i in 1 2 3; do
            if gh workflow run pages.yml --repo "$REPO" --ref main; then
              echo "Pages deploy requested for $(git rev-parse HEAD)"
              exit 0
            fi
            echo "dispatch failed (attempt $i), retrying in 15s..."; sleep 15
          done
          echo "Could not start the Pages deploy"; exit 1
