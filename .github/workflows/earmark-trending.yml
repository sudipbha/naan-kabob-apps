name: Refresh Earmark trending

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: earmark-ai-trending
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Offline parser and policy self-test
        run: node tools/earmark-trending-refresh.js --self-test
      - name: Generate and validate curated metadata
        run: |
          node tools/earmark-trending-refresh.js
          node tools/earmark-trending-refresh.js --validate earmark/trending.json
      - name: Commit only when the feed changed
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- earmark/trending.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add earmark/trending.json
          git commit -m "Refresh Earmark AI trending feed"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
